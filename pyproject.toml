[project]
name = "bamboost"
version = "0.14.0"
description = "A light weight scientific data management system using HDF5"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Flavio Lorez", email = "florez@ethz.ch" },
]
license = "MIT"
license-files = ["LICENSE",]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["hdf5", "database", "database-manager"]
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "typing-extensions>=4.12.2",
    "jinja2>=3.1.5",
    "simmr",
]

[project.urls]
Homepage = "https://bamboost.ch/"
repository = "https://github.com/smec-ethz/bamboost"
changelog = "https://github.com/smec-ethz/bamboost/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.18.1",
    "pip>=24.3.1",
    "twine>=5.1.1",
    "ipywidgets>=8.1.5",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mpi",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.ty.environment]
python-version = "3.10"
python-platform = "linux"

[tool.ty.src]
exclude = [
    "build",
    "dist",
    "docs",
    ".venv",
]

[tool.ty.rules]
invalid-method-override = "warn"

[tool.coverage.run]
source = ["bamboost"]

[tool.uv.workspace]
members = [
    "simmr",
]

[tool.uv.sources]
simmr = { workspace = true }
[tool.uv.workspace]
members = [
    "extensions/dataclasses",
    "extensions/expdesign",
]
